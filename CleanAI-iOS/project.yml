name: CleanAI
options:
  bundleIdPrefix: com.sinapser0x
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion.git
    from: 1.1.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
targets:
  CleanAI:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CleanAI
    dependencies:
      - package: StableDiffusion
        product: StableDiffusion
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sinapser0x.cleanai
        PRODUCT_NAME: CleanAI
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
    info:
      path: CleanAI/Info.plist
      properties:
        CFBundleDisplayName: CleanAI
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSPhotoLibraryAddUsageDescription: "CleanAI salva nella libreria Foto le immagini elaborate sul dispositivo."
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
